# Proposal only: outside .github/workflows, so it cannot run or change monitoring.
# After explicit approval, use ONLY on a dedicated organization test branch,
# temporarily replacing that branch's existing security-smoke.yml. Never merge it.
name: '[TEST] Personal notification delivery'
run-name: '[TEST] Personal notification delivery ${{ github.run_id }}'

on:
  workflow_dispatch:
    inputs:
      confirm_test:
        description: 'Explicitly approved single failure test; no site outage'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  notification-test:
    if: >-
      github.repository == 'Radovar-com/codevalanche-site' &&
      startsWith(github.ref, 'refs/heads/codex/notification-proof-') &&
      github.event_name == 'workflow_dispatch' && inputs.confirm_test == true
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Produce the explicitly labelled test failure
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/heads/codex/notification-proof-*) ;;
            *) echo 'Refused: isolated notification-test branch required.'; exit 2 ;;
          esac
          echo 'TEST ONLY: intentionally failed job to verify personal inbox delivery.'
          echo 'No checkout, secrets, site requests, provider mutations or deployment.'
          exit 1
