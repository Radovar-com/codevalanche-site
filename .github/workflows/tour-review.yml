name: Tour review captures

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/tour-review.yml'

permissions:
  contents: read

jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
          persist-credentials: false
      - name: Check out unchanged baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Build baseline
        working-directory: baseline
        run: npm ci && npm run build
      - name: Build candidate
        working-directory: candidate
        run: npm ci && npm run build
      - name: Install browser
        working-directory: candidate
        run: npx playwright install --with-deps chromium
      - name: Capture before
        working-directory: candidate
        env:
          TOUR_DIST: ../baseline/dist
          TOUR_ARTIFACTS: ${{ runner.temp }}/tour-review/before
        run: node scripts/tour-browser-test.mjs --baseline
      - name: Verify and capture after
        working-directory: candidate
        env:
          TOUR_ARTIFACTS: ${{ runner.temp }}/tour-review/after
        run: node scripts/tour-browser-test.mjs
      - name: Attach review captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tour-before-after
          path: ${{ runner.temp }}/tour-review
          retention-days: 30
          if-no-files-found: error
